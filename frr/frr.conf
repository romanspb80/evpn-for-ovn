frr version 10.7.1
frr defaults traditional
hostname clab-evpn-kind-frr-frr
log stdout
no ipv6 forwarding
hostname frr
service integrated-vtysh-config
!
router bgp 64512
 no bgp ebgp-requires-policy
 ! Runtime peers are discovered and configured by the EVPN test harness.
 ! Do not pin stale 172.19.x addresses here; the lab network is runtime-driven.
 ! The current BGP session must be formed from the live containerlab topology.
exit
!
