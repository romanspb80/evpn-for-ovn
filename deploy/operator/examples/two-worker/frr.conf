frr defaults traditional
hostname external-evpn
service integrated-vtysh-config
router bgp 64512
 bgp router-id 192.0.2.30
 neighbor 192.0.2.11 remote-as 64512
 neighbor 192.0.2.12 remote-as 64512
 address-family l2vpn evpn
  neighbor 192.0.2.11 activate
  neighbor 192.0.2.12 activate
  advertise-all-vni
  vni 1000
   rd 192.0.2.30:1000
   route-target import 64512:1000
   route-target export 64512:1000
  exit-vni
 exit-address-family
!
