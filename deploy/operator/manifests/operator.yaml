apiVersion: v1
kind: Namespace
metadata:
  name: evpn-operator-system
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: evpncores.evpn.romanspb80.github.io
spec:
  group: evpn.romanspb80.github.io
  scope: Namespaced
  names:
    kind: EvpnCore
    plural: evpncores
    singular: evpncore
    shortNames: ["ecore"]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                enabled:
                  type: boolean
                appNamespace:
                  type: string
                ovnNamespace:
                  type: string
                appImage:
                  type: string
                gobgpImage:
                  type: string
                ovnImage:
                  type: string
                dataplaneNode:
                  type: string
                  description: Single designated Kubernetes Node for operator-managed OVN/OVS and Node-Agent.
                bgp:
                  type: object
                  default: {}
                  properties:
                    provider:
                      type: string
                      default: k8gobgp
                      enum: [k8gobgp]
                nodeAgent:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: false
                    image:
                      type: string
                    nodeSelector:
                      type: object
                      additionalProperties:
                        type: string
                    tolerations:
                      type: array
                      items:
                        type: object
                        properties:
                          key: {type: string}
                          operator: {type: string, enum: [Exists, Equal]}
                          value: {type: string}
                          effect: {type: string, enum: [NoSchedule, PreferNoSchedule, NoExecute]}
                          tolerationSeconds: {type: integer, format: int64}
                    mode:
                      type: string
                      enum: [in-memory, real-ovn-ovs]
                    networkBackend:
                      type: string
                      enum: [in-memory, linux-veth]
                    socket: {type: string}
                    ovnNBEndpoint: {type: string}
                    ovsdbEndpoint: {type: string}
                    ovnSBEndpoint: {type: string}
                    exportConfigPath: {type: string}
                    exportStatusPath: {type: string}
                    exportInterval: {type: string}
                    exportTimeout: {type: string}
                    remoteConfigPath: {type: string}
                    remoteStatusPath: {type: string}
                    remoteInterval: {type: string}
                    remoteTimeout: {type: string}
                    gobgpHostPath: {type: string}
                    cniContinuityConfigPath: {type: string}
                    providerAttestation: {type: boolean, default: false}
                    providerCTRHostPath:
                      type: string
                      description: Administrator-pinned static ctr binary on the designated host.
              required: [enabled]
            status:
              type: object
              properties:
                phase:
                  type: string
                ready:
                  type: boolean
                reason:
                  type: string
                observedGeneration:
                  type: integer
                  format: int64
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [type, status, reason, message, lastTransitionTime]
                    properties:
                      type: {type: string}
                      status: {type: string, enum: ["True", "False", Unknown]}
                      observedGeneration: {type: integer, format: int64}
                      reason: {type: string}
                      message: {type: string}
                      lastTransitionTime: {type: string, format: date-time}
                managedResources:
                  type: array
                  items:
                    type: object
                    required: [apiVersion, kind, namespace, name]
                    properties:
                      apiVersion: {type: string}
                      kind: {type: string}
                      namespace: {type: string}
                      name: {type: string}
                      uid: {type: string}
                      state: {type: string, enum: [CreationPending, Observed]}
                      conflict: {type: string}
      subresources:
        status: {}
  conversion:
    strategy: None
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: evpn-core-operator
  namespace: evpn-operator-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: evpn-core-operator
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services", "serviceaccounts", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "daemonsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["evpn.romanspb80.github.io"]
    resources: ["evpncores"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["evpn.romanspb80.github.io"]
    resources: ["evpncores/status", "evpncores/finalizers"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: evpn-core-operator-leases
  namespace: evpn-operator-system
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: evpn-core-operator-leases
  namespace: evpn-operator-system
subjects:
  - kind: ServiceAccount
    name: evpn-core-operator
    namespace: evpn-operator-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: evpn-core-operator-leases
---
# Deliberately unbound: grant only to explicitly trusted cluster administrators.
# EvpnCore writes can launch arbitrary root/privileged host workloads.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: evpn-core-administrator
rules:
  - apiGroups: ["evpn.romanspb80.github.io"]
    resources: ["evpncores"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: evpn-core-operator
subjects:
  - kind: ServiceAccount
    name: evpn-core-operator
    namespace: evpn-operator-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: evpn-core-operator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: evpn-core-operator
  namespace: evpn-operator-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: evpn-core-operator
  template:
    metadata:
      labels:
        app: evpn-core-operator
    spec:
      serviceAccountName: evpn-core-operator
      containers:
        - name: operator
          image: evpn4ovn/operator:kind
          imagePullPolicy: IfNotPresent
