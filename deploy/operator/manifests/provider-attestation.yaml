# Administrator-installed observer access; not owned/deleted by EvpnCore.
# Adjust namespaces and node resourceNames for the designated single node.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: evpn-provider-observer
  namespace: evpn-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: evpn-provider-observer
  namespace: k8gobgp-system
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    resourceNames: ["k8gobgp"]
    verbs: ["get"]
  - apiGroups: ["bgp.purelb.io"]
    resources: ["configs"]
    resourceNames: ["cni-export"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: evpn-provider-observer
  namespace: k8gobgp-system
subjects:
  - kind: ServiceAccount
    name: evpn-provider-observer
    namespace: evpn-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: evpn-provider-observer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: evpn-provider-node-observer
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    resourceNames: ["evpn-lab-control-plane"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: evpn-provider-node-observer
subjects:
  - kind: ServiceAccount
    name: evpn-provider-observer
    namespace: evpn-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: evpn-provider-node-observer
