apiVersion: v1
kind: Namespace
metadata:
  name: evpn-system
---
apiVersion: v1
kind: Namespace
metadata:
  name: ovn-system
---
# The upstream k8gobgp installer owns its Service, speaker and BGPConfiguration.
---
apiVersion: v1
kind: Service
metadata:
  name: ovn-ovs
  namespace: ovn-system
spec:
  clusterIP: None
  selector:
    app: ovn-ovs
  ports:
    - name: ovsdb
      port: 6640
      targetPort: 6640
    - name: ovnnb
      port: 6641
      targetPort: 6641
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ovn-ovs
  namespace: ovn-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ovn-ovs
  template:
    metadata:
      labels:
        app: ovn-ovs
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: ovn-ovs
          image: evpn4ovn/ovn-ovs:kind
          imagePullPolicy: IfNotPresent
          env:
            - name: OVN_EVPN_VXLAN_PORTS
              value: "4789"
            - name: OVN_EVPN_LOCAL_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          securityContext:
            privileged: true
            capabilities:
              add: ["NET_ADMIN"]
          ports:
            - containerPort: 6640
              hostPort: 6640
              name: ovsdb
            - containerPort: 6641
              hostPort: 6641
              name: ovnnb
            - containerPort: 4789
              hostPort: 4789
              protocol: UDP
              name: vxlan
          volumeMounts:
            - name: ovs-runtime
              mountPath: /var/run/openvswitch
            - name: ovn-runtime
              mountPath: /var/run/ovn
      volumes:
        - name: ovs-runtime
          hostPath:
            path: /run/openvswitch
            type: DirectoryOrCreate
        - name: ovn-runtime
          hostPath:
            path: /run/ovn
            type: DirectoryOrCreate
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: evpn-node-agent
  namespace: evpn-system
spec:
  selector:
    matchLabels:
      app: evpn-node-agent
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  template:
    metadata:
      labels:
        app: evpn-node-agent
    spec:
      hostNetwork: true
      hostPID: true
      dnsPolicy: ClusterFirstWithHostNet
      automountServiceAccountToken: false
      nodeSelector:
        evpn.romanspb80.github.io/dataplane-ready: "true"
      initContainers:
        - name: wait-for-runtime
          image: evpn4ovn/node-agent:kind
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args: ["test -S /var/run/ovn/ovnnb_db.sock && test -S /var/run/openvswitch/db.sock"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - {name: ovs-runtime, mountPath: /var/run/openvswitch}
            - {name: ovn-runtime, mountPath: /var/run/ovn}
            - {name: agent-runtime, mountPath: /run/evpn-node-agent}
      containers:
        - name: agent
          image: evpn4ovn/node-agent:kind
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/evpn-node-agent"]
          securityContext:
            privileged: true
            runAsUser: 0
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          readinessProbe:
            exec:
              command: ["/bin/sh", "-ec", "nc -z -U /run/evpn-node-agent/agent.sock"]
            periodSeconds: 5
          volumeMounts:
            - {name: ovs-runtime, mountPath: /var/run/openvswitch}
            - {name: ovn-runtime, mountPath: /var/run/ovn}
            - {name: agent-runtime, mountPath: /run/evpn-node-agent}
            - {name: netns, mountPath: /run/netns, mountPropagation: HostToContainer}
            - {name: gobgp, mountPath: /var/run/gobgp, readOnly: true}
      volumes:
        - name: ovs-runtime
          hostPath: {path: /run/openvswitch, type: DirectoryOrCreate}
        - name: ovn-runtime
          hostPath: {path: /run/ovn, type: DirectoryOrCreate}
        - name: agent-runtime
          hostPath: {path: /run/evpn-node-agent, type: DirectoryOrCreate}
        - name: netns
          hostPath: {path: /run/netns, type: DirectoryOrCreate}
        - name: gobgp
          hostPath: {path: /run/gobgp, type: DirectoryOrCreate}
